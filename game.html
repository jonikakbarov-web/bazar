<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Знаешь ли ты меня?</title>
<meta name="theme-color" content="#137a7f">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="fam.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: тёплый, игривый — вечерний разговор двоих
   IDEA: карточки-вопросы, как настольная игра для пары
   PICTURE: большая карточка вопроса с четырьмя ответами
   COLOUR and TYPE: бирюза и гранат на тёплом белом; Rubik
   LAYOUT: счёт сверху, карточка по центру, ответы стопкой */
:root{color-scheme:light dark;--bg:light-dark(#fbf8f2,#0f1b1d);--card:light-dark(#fff,#16272a);--ink:light-dark(#1c2426,#eef3f1);
--mute:light-dark(#6b7476,#93a4a3);--line:light-dark(#e8e2d6,#263a3d);--tq:light-dark(#137a7f,#3fb6b4);--tq2:light-dark(#e3f2f1,#173638);--red:#c2384b;--gold:#f0b429}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Rubik,system-ui,sans-serif;overflow-x:clip}
.wrap{max-width:540px;margin:0 auto;padding:14px max(4vw,14px) calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.top a{color:var(--tq);text-decoration:none;font-weight:500;min-height:44px;display:flex;align-items:center}
h1{font-size:24px;margin:0;flex:1;text-align:right;line-height:1.1}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 14px}
.score .p b{display:block}.score .p small{color:var(--mute);font-size:13px}.score .p:last-child{text-align:right}
.score .n{font:700 28px Rubik,sans-serif;font-variant-numeric:tabular-nums}
.on{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2fb36b;margin-left:4px;vertical-align:middle}
.qcard{background:var(--tq);color:#fff;border-radius:22px;padding:22px 20px;margin:16px 0 12px;box-shadow:0 8px 0 light-dark(#0e5d61,#0b3f42);position:relative}
.qcard .k{font-size:14px;opacity:.85}
.qcard h2{font-size:clamp(22px,6vw,28px);line-height:1.15;margin:8px 0 0;text-wrap:balance}
.prog{display:flex;gap:6px;margin-top:16px}.prog i{flex:1;height:6px;border-radius:3px;background:rgba(255,255,255,.3)}.prog i.d{background:#fff}
.opts{display:grid;gap:10px}
.opt{border:2px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;min-height:56px;padding:12px 16px;font:500 17px Rubik,sans-serif;text-align:left;cursor:pointer}
.opt:active{transform:scale(.98);border-color:var(--tq)}
.btn{display:block;width:100%;border:0;border-radius:14px;min-height:54px;font:500 17px Rubik,sans-serif;cursor:pointer;background:var(--tq);color:#fff;margin-top:12px}
.btn.ghost{background:var(--tq2);color:var(--tq)}
.btn:disabled{opacity:.5}
.hero{text-align:center;padding:24px 8px}
.hero .big{font:700 64px Rubik,sans-serif;line-height:1;color:var(--tq)}
.hero p{color:var(--mute);margin:10px 0 0}
.res{display:grid;gap:8px;margin-top:8px}
.ri{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;border-left:5px solid var(--red)}
.ri.ok{border-left-color:#2fb36b}
.ri .q{font-size:14px;color:var(--mute)}.ri .a{font-weight:500;margin-top:2px}.ri .g{font-size:14px;margin-top:2px}
.note{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;text-align:center;margin-top:16px}
.status{font-size:14px;color:var(--mute);text-align:center;margin-top:12px;min-height:20px}
@media(prefers-reduced-motion:no-preference){.qcard{animation:in .25s ease-out}@keyframes in{from{transform:translateY(8px);opacity:0}}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="./">← Список базара</a><h1>Знаешь ли ты меня?</h1></div>
  <div id="score" class="score" hidden></div>
  <div id="view"></div>
  <div class="status" id="status" role="status"></div>
</div>
<script>
{
const Q=[
['Идеальный выходной',['Дома под пледом','Прогулка по городу','В гостях у родных','Поездка за город']],
['Любимое время суток',['Утро','День','Вечер','Ночь']],
['Что выберу на ужин',['Плов','Шашлык','Лагман','Что-то лёгкое, салат']],
['Что я пью чаще всего',['Зелёный чай','Чёрный чай','Кофе','Что-то холодное']],
['Если бы выиграл(а) много денег, первым делом',['Путешествие','Машина или ремонт','Отложил(а) бы','Подарки близким']],
['Сладкое к чаю',['Шоколад','Печенье и вафли','Кусочек торта','Сухофрукты и орехи']],
['Любимое время года',['Весна','Лето','Осень','Зима']],
['Что раздражает больше всего',['Опоздания','Беспорядок','Громкий шум','Когда не слушают']],
['Куда бы поехал(а) прямо сейчас',['На море','В горы','В большой город','К родным']],
['По режиму я',['Жаворонок','Сова','Как получится','Люблю поспать днём']],
['Фильм на вечер',['Комедия','Боевик','Драма','Мультфильм']],
['В магазине я',['Беру строго по списку','Беру всё, что понравилось','Долго сравниваю цены','Стараюсь поскорее уйти']],
['Какую суперсилу выберу',['Читать мысли','Летать','Останавливать время','Телепортация']],
['Лучший подарок для меня',['Цветы или украшение','Полезное для дома','Впечатления','Сделанное своими руками']],
['Как я отдыхаю после трудного дня',['Сплю','Сижу в телефоне','Гуляю','Болтаю с кем-то']],
['Любимый фрукт',['Виноград','Арбуз или дыня','Гранат','Яблоко']],
['Что у меня получается вкуснее всего',['Плов','Выпечка','Салаты','Лучше закажу']],
['Главное в доме',['Уют','Чистота','Вкусная еда','Тишина']],
['Какое животное мне ближе',['Кошка','Собака','Попугай','Никакое']],
['В споре я',['Быстро уступаю','Стою на своём','Молчу, потом возвращаюсь','Шучу, чтобы разрядить']],
['Идеальный завтрак',['Яичница','Каша','Лепёшка с каймаком','Только чай']],
['О чём мечтаю больше',['Свой дом','Путешествия','Своё дело','Спокойная жизнь']],
['Сколько смогу без телефона',['Пару минут','Час','Целый день','Хоть неделю']],
['Первое, что делаю утром',['Беру телефон','Умываюсь','Пью чай','Ещё пять минут сна']],
['Какая музыка мне ближе',['Узбекская','Русская','Зарубежная','Тишина лучше']],
['Любимый цвет',['Синий','Зелёный','Красный','Чёрный или белый']],
['Лучшее мамино блюдо',['Плов','Манты','Шурпа','Самса']],
['Отпуск мечты',['Активный','Пляж и отдых','Экскурсии','Дома с семьёй']],
['В компании я',['Душа компании','Слушаю других','Зависит от настроения','Лучше бы дома']],
['Чего я боюсь',['Высоты','Темноты','Змей и насекомых','Ничего не боюсь']],
['Если опаздываю, то',['Звоню и предупреждаю','Бегу молча','Придумываю причину','Я не опаздываю']],
['Мой стиль в одежде',['Удобно и просто','Классика','Ярко и модно','Как придётся']],
];
const N=5;
const $=id=>document.getElementById(id);const esc=BZ.esc;const TWA=BZ.TWA;
if(TWA){try{TWA.ready();TWA.expand();const th=()=>document.documentElement.dataset.theme=TWA.colorScheme==='dark'?'dark':'light';th();TWA.onEvent('themeChanged',th)}catch(e){}}
const haptic=t=>{try{TWA&&TWA.HapticFeedback&&(t?TWA.HapticFeedback.notificationOccurred(t):TWA.HapticFeedback.impactOccurred('light'))}catch(e){}};
const status=(t,ms)=>{$('status').textContent=t||'';if(ms)setTimeout(()=>{if($('status').textContent===t)$('status').textContent=''},ms)};
const rid=()=>Math.random().toString(36).slice(2,12)+Date.now().toString(36);
const URL_=BZ.BASE+'game.html';

let me=null,fam=null,NTFY='',KEY='',events=[],seen=new Set(),lastPing=0;
let draft=null; // {mode:'answer'|'guess', i, picks:[], round}

function addEvent(e){if(!e||typeof e.id!=='string'||e.id.length>40||seen.has(e.id))return false;
  if(e.t==='round'&&!(Array.isArray(e.q)&&Array.isArray(e.a)&&e.q.length===N&&e.a.length===N&&e.q.every(x=>Number.isInteger(x)&&Q[x])&&e.a.every(x=>Number.isInteger(x)&&x>=0&&x<4)))return false;
  if(e.t==='guess'&&!(typeof e.r==='string'&&Array.isArray(e.g)&&e.g.length===N&&e.g.every(x=>Number.isInteger(x)&&x>=0&&x<4)))return false;
  if(e.t!=='round'&&e.t!=='guess')return false;
  if(e.by!==me.id&&e.by!==fam.id)return false;
  seen.add(e.id);events.push(e);events.sort((a,b)=>(a.ts||0)-(b.ts||0));BZ.LS.set(KEY,events.slice(-200));return true}
const name=id=>id===me.id?'Ты':fam.name;
function state(){const rounds=events.filter(e=>e.t==='round');const guesses=events.filter(e=>e.t==='guess');
  const score={};score[me.id]=0;score[fam.id]=0;let games={};games[me.id]=0;games[fam.id]=0;
  const res=rounds.map(r=>{const g=guesses.find(x=>x.r===r.id&&x.by!==r.by);let hit=null;if(g){hit=r.a.filter((a,i)=>a===g.g[i]).length;score[g.by]+=hit;games[g.by]++}return{r,g,hit}});
  return{cur:res[res.length-1]||null,score,games}}

function renderScore(){const s=state();const el=$('score');el.hidden=false;
  const on=Date.now()-lastPing<40000;
  el.innerHTML=`<div class="p"><b>Ты</b><small>угадано</small></div><div class="n">${s.score[me.id]} : ${s.score[fam.id]}</div><div class="p"><b>${esc(fam.name)}${on?'<span class="on"></span>':''}</b><small>угадано</small></div>`}

function render(){renderScore();const v=$('view');
  if(draft){const r=draft.round;const qi=draft.mode==='answer'?draft.qs[draft.i]:r.q[draft.i];const [qt,opts]=Q[qi];
    v.innerHTML=`<div class="qcard"><div class="k">${draft.mode==='answer'?'Ответь честно о себе':'Как ответил(а) '+esc(fam.name)+'?'} · ${draft.i+1} из ${N}</div><h2>${esc(qt)}</h2>
      <div class="prog">${Array.from({length:N},(_,i)=>`<i class="${i<draft.i?'d':''}"></i>`).join('')}</div></div>
      <div class="opts">${opts.map((o,i)=>`<button class="opt" data-o="${i}" type="button">${esc(o)}</button>`).join('')}</div>`;return}
  const s=state();const c=s.cur;
  if(!c){v.innerHTML=`<div class="hero"><div class="big">?</div><h2>Насколько хорошо вы знаете друг друга</h2><p>Ты отвечаешь на ${N} вопросов о себе, а ${esc(fam.name)} пытается угадать твои ответы. Потом наоборот.</p></div>
    <button class="btn" id="start" type="button">Начать — ответить о себе</button>`;return}
  if(!c.g){if(c.r.by===me.id){v.innerHTML=`<div class="note"><b>Ты ответил(а) на ${N} вопросов ✓</b><p style="color:var(--mute);margin:8px 0 0">Ждём, пока ${esc(fam.name)} угадает твои ответы.</p></div>
      <button class="btn ghost" id="poke" type="button">Напомнить ${esc(fam.name)}</button>`}
    else{v.innerHTML=`<div class="hero"><div class="big">${N}</div><h2>${esc(fam.name)} ответил(а) на вопросы о себе</h2><p>Угадаешь, что выбрал(а)?</p></div>
      <button class="btn" id="guess" type="button">Угадывать</button>`}return}
  // результат
  const r=c.r,g=c.g;const iGuessed=g.by===me.id;
  v.innerHTML=`<div class="hero"><div class="big">${c.hit}/${N}</div><p>${iGuessed?'Ты угадал(а) ответы '+esc(fam.name):esc(fam.name)+' угадал(а) твои ответы'}${c.hit>=4?' — вот это знание! 💛':c.hit>=2?' — неплохо':' — есть что обсудить за чаем ☕'}</p></div>
   <div class="res">${r.q.map((qi,i)=>{const[qt,o]=Q[qi];const ok=r.a[i]===g.g[i];return `<div class="ri ${ok?'ok':''}"><div class="q">${esc(qt)}</div><div class="a">${esc(o[r.a[i]])}</div>${ok?'':`<div class="g">Вариант угадывавшего: ${esc(o[g.g[i]])}</div>`}</div>`}).join('')}</div>
   <button class="btn" id="start" type="button">Новый раунд — ответить о себе</button>`}

function pick(n){const qs=[];const used=new Set(events.filter(e=>e.t==='round').slice(-6).flatMap(e=>e.q));
  const pool=Q.map((_,i)=>i).filter(i=>!used.has(i));const src=pool.length>=n?pool:Q.map((_,i)=>i);
  while(qs.length<n){const x=src[Math.random()*src.length|0];if(!qs.includes(x))qs.push(x)}return qs}

$('view').onclick=async e=>{const b=e.target.closest('button');if(!b)return;
  if(b.id==='start'){draft={mode:'answer',i:0,picks:[],qs:pick(N),round:null};render();return}
  if(b.id==='guess'){draft={mode:'guess',i:0,picks:[],round:state().cur.r};render();return}
  if(b.id==='poke'){const ok=await BZ.send(fam.id,'<b>'+esc(me.name)+'</b> ждёт тебя в игре «Знаешь ли ты меня?» 💛',{text:'Открыть игру 🎮',url:URL_});status(ok?'Напоминание отправлено':'Не удалось отправить',3000);haptic('success');return}
  if(b.dataset.o!==undefined&&draft){haptic();draft.picks.push(+b.dataset.o);draft.i++;
    if(draft.i<N){render();return}
    let ev,msg;
    if(draft.mode==='answer'){ev={t:'round',id:rid(),by:me.id,q:draft.qs,a:draft.picks,ts:Date.now()};msg='<b>'+esc(me.name)+'</b> ответил(а) на '+N+' вопросов о себе. Угадаешь его/её ответы? 🤔'}
    else{const r=draft.round;const hit=r.a.filter((a,i)=>a===draft.picks[i]).length;ev={t:'guess',id:rid(),by:me.id,r:r.id,g:draft.picks,ts:Date.now()};msg='<b>'+esc(me.name)+'</b> угадал(а) '+hit+' из '+N+' твоих ответов 🎯 Посмотри результат!'}
    draft=null;addEvent(ev);render();haptic('success');publish(ev);
    if(Date.now()-lastPing>35000)BZ.send(fam.id,msg,{text:'Открыть игру 🎮',url:URL_})}};

const publish=e=>fetch(NTFY,{method:'POST',body:JSON.stringify(e)}).then(r=>{if(!r.ok)throw 0}).catch(()=>status('Нет связи — проверь интернет и попробуй ещё раз',5000));
function onMsg(raw){let e;try{e=JSON.parse(raw)}catch(x){return}if(!e||typeof e!=='object')return;
  if(e.t==='ping'){if(e.by===fam.id){const was=Date.now()-lastPing<40000;lastPing=Date.now();if(!was&&!draft)renderScore()}return}
  if(addEvent(e)&&e.by!==me.id){haptic('success');if(!draft)render()}}
async function loadHistory(){try{const t=await fetch(NTFY+'/json?poll=1&since=all',{cache:'no-store'}).then(r=>r.text());
  for(const l of t.split('\n'))if(l){try{const m=JSON.parse(l);if(m.event==='message')onMsg(m.message)}catch(x){}}}catch(e){status('Нет связи с игрой — проверь интернет')}}
const ping=()=>{if(!document.hidden)fetch(NTFY,{method:'POST',body:JSON.stringify({t:'ping',by:me.id})}).catch(()=>{})};

(async()=>{me=BZ.me;
  if(!me){$('view').innerHTML=`<div class="note"><b>Игра работает внутри Telegram</b><p style="color:var(--mute);margin:8px 0 0">Открой @bazarjay_bot → кнопка «Базар» → вкладка «Игра».</p></div><a class="btn" href="https://t.me/bazarjay_bot" style="text-align:center;line-height:54px;text-decoration:none">Открыть бота</a>`;return}
  fam=await BZ.load();
  if(!fam){$('view').innerHTML=`<div class="note"><b>Сначала подключи пару</b><p style="color:var(--mute);margin:8px 0 0">Вернись в «Список базара» и введи код мужа или жены — тогда сможете играть вместе.</p></div><a class="btn" href="./" style="text-align:center;line-height:54px;text-decoration:none">К списку</a>`;return}
  fam={...fam,name:fam.name.replace(/\s*\(.*\)$/,'')};
  NTFY='https://ntfy.sh/'+fam.topic;KEY='q-'+fam.topic;
  events=(BZ.LS.get(KEY)||[]).filter(e=>e&&e.id);seen=new Set(events.map(e=>e.id));
  render();await loadHistory();render();
  const es=new EventSource(NTFY+'/sse');es.onmessage=ev=>{try{const m=JSON.parse(ev.data);if(m.event==='message')onMsg(m.message)}catch(x){}};
  ping();setInterval(ping,20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden){ping();loadHistory().then(()=>{if(!draft)render()})}});
})();
}
</script>
</body>
</html>
